server {
    listen 80;
    server_name _;

    client_max_body_size 100M;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri /index.html;
        # index.html itself must never be cached - it's the thing that carries the
        # ?v=... cache-busting query strings for every other asset, so a stale cached
        # copy of it silently pins the browser to old JS/CSS forever, ignoring version
        # bumps entirely (this bit us: bumping style.css's ?v= had no effect because
        # the browser was still serving a cached index.html with the old link tag).
        add_header Cache-Control "no-cache" always;
    }

    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Batch title deed OCR (backend/utils/ocr.py) processes large uploads in
        # sequential chunks of a few pages each - a big batch can take several minutes
        # end-to-end, well beyond a typical API's response time.
        proxy_read_timeout 1200s;
    }
}
